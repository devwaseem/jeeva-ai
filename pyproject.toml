[project]
name = "jeeva-ai"
version = "0.1.0"
description = "Typed, trainable finite decisions with causal language models and bidirectional encoders."
readme = "README.md"
authors = [
    { name = "Waseem Akram", email = "waseem07799@gmail.com" }
]
license = "Apache-2.0"
keywords = [
    "llm",
    "structured-outputs",
    "decision-engine",
    "selective-classification",
    "lora",
    "kv-cache",
    "fastapi",
    "transformers",
    "pydantic",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.26.0",
    "torch>=2.6.0",
    "safetensors>=0.4.3",
    "transformers>=4.50.0",
]

[project.urls]
Homepage = "https://github.com/waseem07799/jeeva"
Documentation = "https://github.com/waseem07799/jeeva#readme"
Repository = "https://github.com/waseem07799/jeeva"
Issues = "https://github.com/waseem07799/jeeva/issues"

[project.optional-dependencies]
training = [
    "peft>=0.21.0",
]
qlora = [
    "peft>=0.21.0",
    "bitsandbytes>=0.50.0",
]
serve = [
    "fastapi>=0.110.0",
    "pydantic>=2.10.0",
    "uvicorn>=0.28.0",
]
cloud = [
    "openai>=1.50.0",
]
multimodal = [
    "Pillow>=10.0.0",
    "torchvision>=0.18.0",
]

[project.scripts]
jeeva = "jeeva.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "jeeva"

[dependency-groups]
quality = [
    "basedpyright>=1.40.1",
    "ruff>=0.16.8",
]
test = [
    "httpx>=0.27.0",
    "peft>=0.21.0",
    "Pillow>=10.0.0",
    "pytest>=9.1.1",
]
dev = [
    { include-group = "quality" },
    { include-group = "test" },
    "pre-commit>=4.6.2",
]
research = [
    "jupyterlab>=4.6.4",
    "jupyterlab-lsp>=5.3.0",
    "pypdfium2>=5.13.0",
    "torchvision>=0.18.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-m 'not model_integration and not training_integration'"
markers = [
    "model_integration: exercises a real pretrained model and may take minutes",
    "training_integration: performs real adapter training and may take minutes",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = [
    "E501", # line too long
    "B008", # do not perform function calls in argument defaults (fastapi Depends/Query)
    "B905", # zip() without an explicit strict= parameter
]

[tool.basedpyright]
include = ["src"]
pythonVersion = "3.10"
typeCheckingMode = "basic"

