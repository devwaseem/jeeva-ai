name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, format, and typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          version: "0.12.5"
          enable-cache: true
          python-version: "3.12"

      - name: Install quality dependencies
        run: >-
          uv sync --locked --no-default-groups --group quality
          --extra training --extra serve --extra multimodal

      - name: Run Ruff
        run: uv run --no-sync ruff check .

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Run Basedpyright
        run: uv run --no-sync basedpyright src/

  fast-tests:
    name: Fast tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          version: "0.12.5"
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: >-
          uv sync --locked --no-default-groups --group test
          --extra training --extra serve --extra multimodal

      - name: Run fast tests
        run: >-
          uv run --no-sync python -m pytest -v
          -m "not model_integration and not training_integration"

  package:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          version: "0.12.5"
          enable-cache: true
          python-version: "3.12"

      - name: Build wheel and source distribution
        run: uv build

      - name: Validate distribution metadata
        run: uvx --from twine==6.1.0 twine check dist/*

      - name: Verify base wheel in isolation
        run: |
          uv venv --python 3.12 .wheel-base
          uv pip install --python .wheel-base/bin/python dist/*.whl
          .wheel-base/bin/python -c \
            "import jeeva; from importlib.metadata import version; assert jeeva.__version__ == version('jeeva-ai')"
          .wheel-base/bin/jeeva --help

      - name: Verify production extras from the same wheel
        run: |
          wheel_path="$(echo dist/*.whl)"
          uv venv --python 3.12 .wheel-extras
          uv pip install --python .wheel-extras/bin/python \
            "${wheel_path}[training,serve,cloud,multimodal]"
          .wheel-extras/bin/python -c \
            "import fastapi, openai, peft, PIL; import jeeva.serve; from jeeva.training.trainer import Trainer"

      - name: Upload immutable distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
